<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Research — Ingleside</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a1a;
      --muted: #666;
      --line: #ddd;
      --bg: #f7f7f7;
      --card: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1.25rem 3rem;
      background: var(--bg);
      color: var(--ink);
      font-family: "Instrument Sans", "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.6rem;
    }

    .intro {
      margin: 0 0 1.5rem;
      color: var(--muted);
      max-width: 42rem;
    }

    .status {
      margin: 0 0 1.25rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-size: 0.92rem;
    }

    .status[data-state="error"] {
      border-color: #e0b4b4;
      background: #fff5f5;
    }

    .query-block {
      margin-bottom: 2rem;
    }

    .query-block h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
    }

    .query-meta {
      margin: 0 0 0.85rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
    }

    .card-thumb {
      aspect-ratio: 4 / 3;
      background: #e8e8e8;
      overflow: hidden;
    }

    .card-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.8rem 0.85rem 1rem;
      font-size: 0.84rem;
    }

    .card-title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 650;
      line-height: 1.3;
    }

    .card-meta {
      margin: 0;
      color: var(--muted);
    }

    .card-link {
      margin-top: 0.35rem;
      color: #1256a2;
      word-break: break-word;
    }

    .empty {
      padding: 1rem;
      border: 1px dashed #ccc;
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Image research: Ingleside</h1>
    <p class="intro">
      Temporary Wikimedia Commons search for San Francisco’s Ingleside neighborhood.
      Review photographs here before choosing any for the site. Nothing is downloaded or saved automatically.
    </p>
    <div id="status" class="status" data-state="loading">Searching Wikimedia Commons…</div>
    <div id="results"></div>
  </main>

  <script>
    const COMMONS_API = "https://commons.wikimedia.org/w/api.php";
    const RESULTS_PER_QUERY = 5;

    const QUERIES = [
      "Ingleside San Francisco",
      "Ingleside San Francisco Ocean Avenue",
      "Ingleside San Francisco residential houses",
      "Ingleside San Francisco architecture",
    ];

    const PHOTO_MIME_TYPES = new Set([
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/gif",
      "image/tiff",
    ]);

    const NON_PHOTO_PATTERN =
      /\b(map|diagram|illustration|drawing|sketch|logo|icon|chart|plan|floor[\s-]?plan|svg|coat of arms|seal of)\b/i;

    const statusEl = document.querySelector("#status");
    const resultsEl = document.querySelector("#results");
    const seenPageIds = new Set();

    function stripHtml(value) {
      if (!value) {
        return "";
      }

      const template = document.createElement("template");
      template.innerHTML = value;
      return template.content.textContent.replace(/\s+/g, " ").trim();
    }

    function metadataValue(extmetadata, key) {
      return stripHtml(extmetadata?.[key]?.value || "");
    }

    function cleanTitle(title) {
      return title.replace(/^File:/, "").replace(/\.[^.]+$/, "");
    }

    function looksLikeNonPhoto(title, categories) {
      return NON_PHOTO_PATTERN.test(title) || NON_PHOTO_PATTERN.test(categories);
    }

    function buildSearchUrl(query) {
      const params = new URLSearchParams({
        action: "query",
        format: "json",
        origin: "*",
        generator: "search",
        gsrsearch: `${query} filetype:bitmap`,
        gsrnamespace: "6",
        gsrlimit: String(RESULTS_PER_QUERY),
        prop: "imageinfo",
        iiprop: "url|extmetadata|mime|size",
        iiurlwidth: "480",
      });

      return `${COMMONS_API}?${params.toString()}`;
    }

    function createCard(image) {
      const card = document.createElement("article");
      card.className = "card";

      const thumb = document.createElement("div");
      thumb.className = "card-thumb";

      const img = document.createElement("img");
      img.src = image.thumburl;
      img.alt = image.title;
      img.loading = "lazy";
      thumb.append(img);

      const body = document.createElement("div");
      body.className = "card-body";

      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = image.title;

      const artist = document.createElement("p");
      artist.className = "card-meta";
      artist.textContent = `Photographer: ${image.artist}`;

      const license = document.createElement("p");
      license.className = "card-meta";
      license.textContent = `License: ${image.license}`;

      const link = document.createElement("a");
      link.className = "card-link";
      link.href = image.descriptionurl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "View on Wikimedia Commons";

      body.append(title, artist, license, link);
      card.append(thumb, body);
      return card;
    }

    function renderQuerySection(query, images, rawCount) {
      const section = document.createElement("section");
      section.className = "query-block";

      const heading = document.createElement("h2");
      heading.textContent = `Query: “${query}”`;

      const meta = document.createElement("p");
      meta.className = "query-meta";

      if (rawCount === 0) {
        meta.textContent = "No results returned by Wikimedia Commons.";
      } else if (images.length === 0) {
        meta.textContent = `${rawCount} result(s) found, but none remained after photo filtering / deduplication.`;
      } else {
        meta.textContent = `Showing ${images.length} unique photograph(s).`;
      }

      section.append(heading, meta);

      if (images.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No photographs to display for this query.";
        section.append(empty);
      } else {
        const gallery = document.createElement("div");
        gallery.className = "gallery";
        for (const image of images) {
          gallery.append(createCard(image));
        }
        section.append(gallery);
      }

      return section;
    }

    async function run() {
      let totalShown = 0;
      let failed = false;

      for (const query of QUERIES) {
        try {
          const response = await fetch(buildSearchUrl(query));
          if (!response.ok) {
            throw new Error(`Commons API request failed (${response.status})`);
          }

          const data = await response.json();
          const pages = Object.values(data.query?.pages || {});
          const rawCount = pages.length;

          const images = [];
          for (const page of pages.sort((a, b) => (a.index || 0) - (b.index || 0))) {
            const info = page.imageinfo?.[0];
            if (!info) {
              continue;
            }

            const ext = info.extmetadata || {};
            const title = cleanTitle(page.title || "");
            const categories = metadataValue(ext, "Categories");

            if (!PHOTO_MIME_TYPES.has(info.mime)) {
              continue;
            }

            if (looksLikeNonPhoto(title, categories)) {
              continue;
            }

            if (seenPageIds.has(page.pageid)) {
              continue;
            }

            seenPageIds.add(page.pageid);
            images.push({
              pageid: page.pageid,
              title,
              thumburl: info.thumburl || info.url,
              artist: metadataValue(ext, "Artist") || "Unknown",
              license: metadataValue(ext, "LicenseShortName") || "Unknown",
              descriptionurl: info.descriptionurl,
              query,
            });
          }

          totalShown += images.length;
          resultsEl.append(renderQuerySection(query, images, rawCount));
        } catch (error) {
          failed = true;
          const section = document.createElement("section");
          section.className = "query-block";

          const heading = document.createElement("h2");
          heading.textContent = `Query: “${query}”`;

          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = `Search failed: ${error.message}`;

          section.append(heading, empty);
          resultsEl.append(section);
        }
      }

      if (failed && totalShown === 0) {
        statusEl.dataset.state = "error";
        statusEl.textContent = "Unable to load Wikimedia Commons results. Check your network connection and try again.";
        return;
      }

      statusEl.dataset.state = "ready";
      statusEl.textContent = totalShown
        ? `Found ${totalShown} unique photograph(s) across ${QUERIES.length} queries. Duplicates were removed.`
        : "No photographs found for these queries. Try different search terms later.";
    }

    run();
  </script>
</body>
</html>
